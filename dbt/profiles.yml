churn_platform:
  target: dev
  outputs:
    dev:
      type: postgres
      host: localhost
      port: 5432
      user: churn
      pass: churn
      dbname: churn
      schema: public
      threads: 4
    # step 7.3 — CI builds the transformation layer into an isolated
    # schema (raw tables still load into `public`, matching sources.yml's
    # hardcoded schema) rather than reusing `dev`'s schema, so a CI run
    # can never collide with or mutate anyone's local dev state.
    ci:
      type: postgres
      host: "{{ env_var('CHURN_DB_HOST', 'localhost') }}"
      port: 5432
      user: "{{ env_var('CHURN_DB_USER', 'churn') }}"
      pass: "{{ env_var('CHURN_DB_PASSWORD', 'churn') }}"
      dbname: "{{ env_var('CHURN_DB_NAME', 'churn') }}"
      schema: test
      threads: 4
    # AWS_DEPLOYMENT_WALKTHROUGH.md step 6 — the RDS deploy target. Added
    # because `dev` hardcodes host: localhost (doesn't read CHURN_DB_DSN,
    # so "dbt build --target dev" against RDS would silently build against
    # the LOCAL database instead) and `ci`'s schema is `test`, disconnected
    # from sources.yml's hardcoded `public` schema that the raw tables
    # actually load into. `prod` reuses `dev`'s schema (public) so marts
    # land where `api/batch_score.py` and the agent views expect them, but
    # reads connection details from env vars like `ci` does.
    prod:
      type: postgres
      host: "{{ env_var('CHURN_DB_HOST') }}"
      port: 5432
      user: "{{ env_var('CHURN_DB_USER', 'churn') }}"
      pass: "{{ env_var('CHURN_DB_PASSWORD') }}"
      dbname: "{{ env_var('CHURN_DB_NAME', 'churn') }}"
      schema: public
      threads: 4
