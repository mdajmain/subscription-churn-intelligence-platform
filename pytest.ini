[pytest]
# The test modules import from the repo root (`from api.main import app`,
# `from agent.tools import ...`). Bare `pytest tests/` does NOT put the
# rootdir on sys.path -- only `python -m pytest` does, and only because it
# adds the current working directory. That difference is why the README's
# documented `python -m pytest tests/` always worked locally while CI's
# `pytest tests/ -v` failed every run with ModuleNotFoundError: No module
# named 'api'.
#
# Setting pythonpath here fixes it for every invocation -- CI, the README
# command, and a bare `pytest` from an IDE -- instead of making one command
# the only correct one.
pythonpath = .
